id: level3-001

repository: repositories/level3-order

prompt: |
  This is a C++ order processing system. The CheckoutService is called from three places:
  a web checkout handler, a mobile checkout handler, and a retry worker that handles
  failed orders from an internal queue.

  The web and mobile handlers are user-facing entry points that initiate checkout on behalf
  of customers. Find both of them and add the following line at the very start of each
  handler's `handle` method:

      std::cerr << "[handler] checkout start\n";

  Do not modify the retry worker.

evaluation:
  category: caller-subset
  relevant_capabilities:
    - callers

validation:
  command: python validate_001.py

expected_files:
  - src/web/web_checkout_handler.cpp

timeout: 300
